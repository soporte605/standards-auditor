# Propuesta de configuración: todavía no es aceptada por la CLI.
schema-version: 1
packs:
  docs:
    enabled: true
    options:
      required-files:
        - README.md
        - CONTRIBUTING.md
  versioning:
    enabled: true
    options:
      strategy: semver
      source: Cargo.toml
      key: workspace.package.version
  changelog:
    enabled: false
    options:
      file: CHANGELOG.md
      require-current-version: true
  unit-tests:
    enabled: false
    options:
      preset: angular
