[workspace]
members = ["crates/auditor-core", "crates/auditor-cli"]
resolver = "3"

[workspace.package]
version = "0.1.0-dev.0"
edition = "2024"
publish = false

[workspace.dependencies]
auditor-core = { path = "crates/auditor-core" }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "warn"
